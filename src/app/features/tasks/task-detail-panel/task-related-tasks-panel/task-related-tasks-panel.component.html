<div class="related-tasks-panel">
  @if (rows().length) {
    <ul class="related-tasks-panel__list">
      @for (row of rows(); track row.key) {
        <li class="related-tasks-panel__item">
          <span class="related-tasks-panel__type">{{
            row.typeLabelKey | translate
          }}</span>
          <button
            class="related-tasks-panel__open"
            mat-button
            (click)="openRelatedTask(row.related)"
          >
            <span class="related-tasks-panel__title">{{ row.related.task.title }}</span>
            @if (row.project; as project) {
              <mat-icon
                class="related-tasks-panel__project-icon"
                [class.related-tasks-panel__project-icon--emoji]="row.isProjectIconEmoji"
                [style.color]="row.isProjectIconEmoji ? null : project.theme?.primary"
                [matTooltip]="project.title"
                matTooltipTouchGestures="off"
                >{{ project.icon || defaultProjectIcon }}</mat-icon
              >
            }
          </button>
          <button
            class="related-tasks-panel__remove"
            mat-icon-button
            [attr.aria-label]="T.F.TASK.RELATED_TASKS.REMOVE | translate"
            (click)="removeRelationship(row)"
          >
            <mat-icon>close</mat-icon>
          </button>
        </li>
      }
    </ul>
  } @else {
    <p class="related-tasks-panel__empty">
      {{ T.F.TASK.RELATED_TASKS.EMPTY | translate }}
    </p>
  }

  <div class="related-tasks-panel__add">
    <select
      class="related-tasks-panel__type-select"
      [attr.aria-label]="T.F.TASK.RELATED_TASKS.TYPE_LABEL | translate"
      (change)="onTypeChange($event)"
      (keydown)="$event.stopPropagation()"
    >
      @for (type of linkableTypes; track type) {
        <option [value]="type">{{ typeLabelKeyOf(type) | translate }}</option>
      }
    </select>
    @for (remountKey of pickerRemountKeys(); track remountKey) {
      <select-task
        (taskChange)="onPickerChange($event)"
        (taskCreate)="onPickerCreate($event)"
        [isIncludeParentTasks]="true"
        [excludedTaskIds]="excludedTaskIds()"
        [defaultProjectId]="sourceProjectId()"
      ></select-task>
    }
  </div>
</div>
