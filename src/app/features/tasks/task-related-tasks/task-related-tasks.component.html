@if (rows().length) {
  <ul class="related-tasks">
    @for (row of rows(); track row.task.id) {
      <li class="related-tasks__item">
        <button
          class="related-tasks__open"
          type="button"
          (click)="openRelatedTasksSection($event)"
        >
          <span class="related-tasks__labels">
            @for (typeLabelKey of row.typeLabelKeys; track typeLabelKey; let last = $last) {
              {{ typeLabelKey | translate }}@if (!last) {, }
            }
          </span>
          <span class="related-tasks__title">{{ row.task.title }}</span>
          @if (row.project; as project) {
            <mat-icon
              class="related-tasks__project-icon"
              [class.related-tasks__project-icon--emoji]="row.isProjectIconEmoji"
              [style.color]="row.isProjectIconEmoji ? null : project.theme?.primary"
              [matTooltip]="project.title"
              matTooltipTouchGestures="off"
              >{{ project.icon || defaultProjectIcon }}</mat-icon
            >
          }
        </button>
      </li>
    }
  </ul>
}
